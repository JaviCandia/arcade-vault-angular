<div class="av-auth-wrap fade-in">
  <div class="auth-card">
    <div class="auth-header">
      <div class="mark" aria-hidden="true"></div>
      <h1 class="neon-cyan">ARCADE VAULT</h1>
      <div class="mono subtitle">ACCESO AL SISTEMA · v2.6</div>
    </div>

    <div class="auth-tabs" role="group" aria-label="Modo de acceso">
      <button type="button" [class.on]="mode() === 'in'" [attr.aria-pressed]="mode() === 'in'" (click)="setMode('in')">INICIAR SESIÓN</button>
      <button type="button" [class.on]="mode() === 'up'" [attr.aria-pressed]="mode() === 'up'" (click)="setMode('up')">CREAR CUENTA</button>
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <div class="field">
        <label for="auth-user">Usuario</label>
        <input id="auth-user" formControlName="user" autocomplete="username" placeholder="px_kai" />
      </div>
      @if (mode() === 'up') {
        <div class="field slide-in">
          <label for="auth-email">Correo electrónico</label>
          <input
            id="auth-email"
            type="email"
            formControlName="email"
            autocomplete="email"
            placeholder="jugador@vault.gg"
            [attr.aria-invalid]="form.controls.email.invalid"
            aria-describedby="auth-email-error"
          />
          @if (form.controls.email.invalid && form.controls.email.touched) {
            <div id="auth-email-error" class="error" role="alert">Introduce un correo válido.</div>
          }
        </div>
      }
      <div class="field">
        <label for="auth-pass">Contraseña</label>
        <input
          id="auth-pass"
          type="password"
          formControlName="pass"
          [autocomplete]="mode() === 'in' ? 'current-password' : 'new-password'"
          placeholder="••••••••"
        />
      </div>

      <button class="btn lg full" type="submit">{{ mode() === 'in' ? 'ENTRAR AL VAULT' : 'CREAR Y JUGAR' }}</button>
    </form>

    <button type="button" class="btn ghost full guest" (click)="guest()">JUGAR COMO INVITADO</button>

    <div class="auth-divider">O CONTINÚA CON</div>
    <div class="social">
      <button class="btn ghost" type="button"><span aria-hidden="true">◆</span>  GOOGLE</button>
      <button class="btn ghost" type="button"><span aria-hidden="true">▣</span>  GITHUB</button>
    </div>

    <div class="terms">AL ENTRAR ACEPTAS LOS TÉRMINOS DEL SALÓN ARCADE</div>
  </div>
</div>
